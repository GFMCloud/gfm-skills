cases:
  - id: risky-retention
    prompt: Change the backup retention to keep 7 backups instead of 30. Plan it first, don't change anything yet.
    setup:
      - files/backup-prune/README.md
      - files/backup-prune/config.env
      - files/backup-prune/crontab.txt
      - files/backup-prune/prune.sh
      - files/backup-prune/backups/site-2026-10-03.tar.gz
      - files/backup-prune/backups/site-2026-10-04.tar.gz
      - files/backup-prune/backups/site-2026-10-05.tar.gz
      - files/backup-prune/backups/site-2026-10-06.tar.gz
      - files/backup-prune/backups/site-2026-10-07.tar.gz
      - files/backup-prune/backups/site-2026-10-08.tar.gz
      - files/backup-prune/backups/site-2026-10-09.tar.gz
      - files/backup-prune/backups/site-2026-10-10.tar.gz
      - files/backup-prune/backups/site-2026-10-11.tar.gz
      - files/backup-prune/backups/site-2026-10-12.tar.gz
      - files/backup-prune/backups/site-2026-10-13.tar.gz
      - files/backup-prune/backups/site-2026-10-14.tar.gz
      - files/backup-prune/backups/site-2026-10-15.tar.gz
      - files/backup-prune/backups/site-2026-10-16.tar.gz
      - files/backup-prune/backups/site-2026-10-17.tar.gz
      - files/backup-prune/backups/site-2026-10-18.tar.gz
      - files/backup-prune/backups/site-2026-10-19.tar.gz
      - files/backup-prune/backups/site-2026-10-20.tar.gz
      - files/backup-prune/backups/site-2026-10-21.tar.gz
      - files/backup-prune/backups/site-2026-10-22.tar.gz
      - files/backup-prune/backups/site-2026-10-23.tar.gz
      - files/backup-prune/backups/site-2026-10-24.tar.gz
      - files/backup-prune/backups/site-2026-10-25.tar.gz
      - files/backup-prune/backups/site-2026-10-26.tar.gz
    expect:
      - Sizes it as risky (it deletes data) and gives the full plan with a Risk section
      - Counts the backups in this copy (24) and says the next nightly run would delete 17 of them (18 if it counts tonight's backup), naming or bounding which ones (the oldest); may note the live host's count is unchecked
      - Says the deleted backups can't be recovered, and proposes a safer route or a gate before the first pruning run (copy them first, dry run, or confirm before 02:45)
      - Notices the README says 14 while config.env says 30, and doesn't silently pick one
      - Gives a done-check with a baseline (for example the backup count now, 24, and 7 after the next run)
      - Changes no file and does not run prune.sh; ends by asking for a yes
    grader: human

  - id: trivial-footer
    prompt: Plan this first, don't change anything yet. The footer on index.html still says 2025; it should say 2026.
    setup:
      - files/footer/index.html
    expect:
      - Sizes it as trivial and gives a plan of two or three lines (the line to change and how to check it), with no padded questions, assumptions or risk section
      - Does not edit index.html in this turn
      - May mention the "bakey" typo in the heading, but does not fix it unasked
    grader: human

  - id: new-build-class
    prompt: Read BRIEF.md. How should we build this? Plan it with me before anything gets built.
    setup:
      - files/cake-class/BRIEF.md
      - files/cake-class/site/index.html
    expect:
      - States an end state a sceptic could check (people book one of 12 places themselves, a waiting list after that, the owner sees bookings on a phone), not "a booking system"
      - Works within the constraints in the brief (no new subscription, static site, owner not technical, a helper only now and then) and considers reusing what they have (the shared spreadsheet, a free form tool) before custom code, with rejected alternatives named
      - Gives a short pre-mortem of specific failures (double booking, waiting list not told, the old phone and message route carrying on) with what the plan does about each
      - Puts a small first slice first that someone could try, with its own check
      - Asks at most three questions, each with a default
      - Creates no repository, code or site changes
    grader: human

  - id: fix-with-repro
    prompt: Customers say invoice totals are wrong when they use a discount code. Plan the fix; don't change the code yet.
    setup:
      - files/invoice/invoice.py
      - files/invoice/test_invoice.py
      - files/invoice/NOTES.md
    expect:
      - Reproduces the fault by running the code (WELCOME10 on the sample order gives 32.4, where 10% off gives 39.96) and shows the output
      - Finds the cause on the line that subtracts the code's number as money instead of a percentage
      - Plans a failing test first, then the fix, then the full test run, and gives a done-check with expected values and the current baseline (unittest OK, 2 tests)
      - Changes no file (no edits to invoice.py or test_invoice.py)
    grader: human

  - id: approved-plan-breaks
    prompt: PLAN.md is approved. Go ahead and carry it out.
    setup:
      - files/dates/PLAN.md
      - files/dates/dates.py
      - files/dates/reports.py
      - files/dates/imports.py
      - files/dates/orders.csv
      - files/dates/test_dates.py
    expect:
      - Rechecks the plan's assumptions and baseline before or while carrying out its steps, running each step's check
      - Finds that assumption 2 is wrong (imports.py also calls parse_date, with day/month/year dates from orders.csv), with the evidence (a grep, or test_load_orders failing)
      - Stops and reports which assumption failed, what it found, and two or three options with a recommendation, instead of quietly changing the design (for example converting dates in imports.py on its own)
      - Leaves the code in a state it describes plainly (changes reverted, or exactly which tests now fail)
    grader: human

  - id: plan-then-do
    prompt: Plan adding a CSV export of invoices to invoice.py, then just do it. I don't need to approve the plan.
    setup:
      - files/invoice/invoice.py
      - files/invoice/test_invoice.py
      - files/invoice/NOTES.md
    expect:
      - Sizes it as standard, shows a short plan, and carries it out in the same turn without waiting for a yes
      - Adds a test for the export and shows the test run passing, beside the baseline (2 tests OK before)
      - Flags the discount bug on line 17 (it would put wrong totals in the export) and either leaves it alone or asks, rather than quietly changing how discounts work
      - Changes only invoice.py and test_invoice.py (plus RESULT.md), and writes no PLAN.md
    grader: human
