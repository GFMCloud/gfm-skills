cases:
  - id: new-landing-branded
    prompt: Design the front page of our website from brief.md. Make it a single HTML file, index.html.
    setup:
      - files/coop-landing/brief.md
      - files/coop-landing/.agents/brand/tokens.json
    expect:
      - 'The reply starts with "Brand: project" and primary=#9a3412'
      - States a one-sentence visual direction that fits the users (neighbours on phones, first-timers)
      - index.html uses the brand variables, makes one main action obvious (come to a workshop or book a lesson), and passes scripts/check_page.py, including no sideways scroll at 390px
      - Uses only facts from brief.md; invents no photos, reviews, numbers or testimonials, and marks missing material with NEEDS YOUR INPUT or leaves it out
      - Avoids the generated-design tells (no purple gradient, no emoji icons, not everything centred)
    grader: human

  - id: redesign-signup
    prompt: Our sign-up page (index.html and style.css) looks dated and is broken on phones. Redesign it.
    setup:
      - files/signup-redesign/index.html
      - files/signup-redesign/style.css
    expect:
      - 'The reply starts with "Brand: default"'
      - Audits before changing, naming at least the 960px width that scrolls sideways on phones, the missing labels, the removed focus outline and the low-contrast grey text
      - Keeps every field name and id, the form action and method, and validateForm(); the two buttons are no longer equal weight
      - The redesigned page passes scripts/check_page.py with --shots (no sideways scroll at 390px, every field labelled, lang and viewport set)
      - Reports the error message "Error!" as unhelpful and either rewrites the words or flags it, without changing what the validation checks
      - Treats it as a form, not a page people read - no subject inventory, idea sentence or copy deck, and the checker runs with --screen
    grader: human

  - id: critique-pricing
    prompt: What's wrong with this pricing page (pricing.html)? Don't change anything yet.
    setup:
      - files/pricing-critique/pricing.html
    expect:
      - 'The reply starts with a "Brand:" line'
      - Separates broken problems (no viewport meta, unreadable button text #a78bfa on #7c3aed, faint grey quotes, cards side by side with no wrap on phones) from taste
      - Names the generated-design tells it uses (purple-to-blue gradient, gradient text, emoji icons, glass cards with glow, three identical cards, "Unlock the power" copy)
      - Flags the testimonial and "10,000+ teams" as needing a real source, and the three equal "Get started" buttons as no main action
      - Changes no files
    grader: human

  - id: stock-landing-taste
    prompt: This landing page (index.html) looks generic, like every AI-made site. Make it look properly designed.
    setup:
      - files/stock-landing/index.html
    expect:
      - 'The reply starts with "Brand: default"'
      - Lists the things only this product has, taken from the page and none invented (Porto, two former translators, three languages, SAF-T PT export, MB Way or SEPA, 9 euros a month, first invoice free)
      - Writes one idea sentence ("on this page, X becomes Y") with X from that list, and says it passes the competitor test (the first blank is not true of another invoicing tool)
      - Rewrites the stock marketing copy (eyebrow, pill badge, "Unlock the power of seamless invoicing", "Elevate your workflow") from the page's own facts, lists the lines it changed, and keeps every fact
      - Keeps the form's action, method, field name and id, and checkEmail(); flags "Sarah K." and "10,000+ freelancers" as needing a real source, and adds no proof of its own
      - The result passes scripts/check_page.py --shots including the frame checks, and the reply records at most three critique rounds with what each one fixed
    grader: human

  - id: juror-critique-frame
    prompt: Look at index.html as a design juror would and tell me the three changes that would improve it most. Don't change anything.
    setup:
      - files/juror-critique/index.html
    expect:
      - 'The reply starts with a "Brand:" line'
      - Runs scripts/check_page.py with --shots into a temporary folder and reports its frame findings - the h1 is below the first screen, the content sits in the left half of a wide screen, a blank stretch over half a screen, and a section with no heading (more of them at phone width)
      - Goes through the juror passes in craft.md on the screenshots (first look, blur, competitor, alignment, frame, content) and says whether the page could belong to any other bike shop
      - Names exactly three changes, ranked by effect, each with where it shows and the fix
      - Changes no files
    grader: human

  - id: restaurant-onepage
    prompt: Build the one-page website in brief.md.
    setup:
      - files/restaurant-brief/brief.md
    expect:
      - 'The reply starts with "Brand: default"'
      - Deals directions with scripts/deal.py (no brand) and builds from the chosen sheet; lists the subject inventory and an idea sentence built from it (the fire lit at 16:00, the oven, the ironmonger's sign, the bar facing the oven), with the competitor test stated
      - Writes the claims and the copy deck before the markup; every heading fits in two lines at 1280px and 390px
      - The menu shows the four real dishes with their prices; any further dish (a sample price allowed) is marked data-sample in the page and listed in the reply as sample content to confirm; no reviews, press, ratings or invented figures about the business
      - For pictures, searches open collections for the subject's world, names the candidates with source page and licence and asks before downloading any (or says the search could not run); no found picture is presented as Casa Lume's own food, room or people
      - index.html passes scripts/check_page.py --shots including the frame checks (equal margins, no huddled section, no blank stretch over half a screen, h1 on the first screen, a heading on every section)
    grader: human

  - id: no-brand-three-directions
    prompt: Give me three different art directions for the landing page in brief.md, pick the one that suits the product best, and build it.
    setup:
      - files/directions-brief/brief.md
    expect:
      - 'The reply starts with "Brand: default"'
      - Runs scripts/deal.py, shows the three dealt directions by id and name, and says in a line why the chosen one can carry something only Ferrolho has
      - Builds from the dealt sheet - its composition, its type and its :root palette block - rather than a look of its own, and names the direction id, the seed and any redeal with its reason in the hand-over
      - Writes no tokens.json or tokens.css (no .agents/brand/ folder is created)
      - index.html passes scripts/check_page.py --shots, uses only facts from brief.md, and invents no photographs, reviews or numbers
    grader: human

  - id: no-brand-portfolio
    prompt: Design my portfolio homepage from brief.md. I have no brand; pick a distinctive look, not the usual template.
    setup:
      - files/portfolio-brief/brief.md
    expect:
      - 'The reply starts with "Brand: default"'
      - Deals directions with scripts/deal.py (sector personal-portfolio) instead of picking a look itself, and builds from the chosen sheet's type and palette
      - Writes no brand tokens file and does not rerun brand.py to change its answer
      - Shows the three works from the brief with their real titles and years and marks the missing scans with NEEDS YOUR INPUT (or draws them in code), inventing no clients or quotes
      - index.html passes scripts/check_page.py --shots
    grader: human

  - id: restyle-fresh-type-palette
    prompt: Restyle index.html with a fresh type system and palette, keeping the layout and content.
    setup:
      - files/restyle-plain/index.html
    expect:
      - 'The reply starts with "Brand: default"'
      - Because the user asked for a new type system and palette and no brand exists, deals with scripts/deal.py and takes the type and palette from the chosen sheet (rather than keeping the page's own colours)
      - Keeps the layout, every word of content, every id, and the join link's href
      - Writes no brand tokens file
      - index.html passes scripts/check_page.py --shots
    grader: human
