<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Haiku Hotline</title>
<style>
  :root { --paper: #f3f1ea; --ink: #1d1d1b; --seal: #b23a2b; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Iowan Old Style", Georgia, serif; }
  h1 { font-weight: 400; font-size: 72px; }
  .seal { color: var(--seal); }
  .haiku { font-style: italic; line-height: 1.8; }
</style>
</head>
<body>
  <h1>Haiku Hotline</h1>
  <p>Describe your problem. We answer in seventeen syllables.</p>
  <div class="haiku">
    <p>Your inbox is full.<br>The emails will still be there.<br>So will the moon. Rest.</p>
  </div>
  <p class="seal">No advice. No follow-up. Just the haiku.</p>
  <form><input type="email" placeholder="Join the waitlist"><button>Wait patiently</button></form>
</body>
</html>
