cases:
  - id: sweep-setup
    prompt: I want every page in docs-old/ converted to the new format in docs-new/ (see FORMAT.md). It's too much for one go, so set it up so any session can carry on and I can tell when it's really finished. Don't convert anything yet.
    setup:
      - files/docs-sweep/FORMAT.md
      - files/docs-sweep/docs-old/allergens.txt
      - files/docs-sweep/docs-old/card-machine.txt
      - files/docs-sweep/docs-old/cash-up.txt
      - files/docs-sweep/docs-old/catering.txt
      - files/docs-sweep/docs-old/complaints.txt
      - files/docs-sweep/docs-old/custom-cakes.txt
      - files/docs-sweep/docs-old/deliveries-in.txt
      - files/docs-sweep/docs-old/delivery-areas.txt
      - files/docs-sweep/docs-old/fire-drill.txt
      - files/docs-sweep/docs-old/first-aid.txt
      - files/docs-sweep/docs-old/flour-suppliers.txt
      - files/docs-sweep/docs-old/fridge-checks.txt
      - files/docs-sweep/docs-old/gift-cards.txt
      - files/docs-sweep/docs-old/holiday-cover.txt
      - files/docs-sweep/docs-old/keys-and-alarm.txt
      - files/docs-sweep/docs-old/lost-property.txt
      - files/docs-sweep/docs-old/loyalty-stamps.txt
      - files/docs-sweep/docs-old/music-licence.txt
      - files/docs-sweep/docs-old/online-orders.txt
      - files/docs-sweep/docs-old/opening-hours.txt
      - files/docs-sweep/docs-old/oven-cleaning.txt
      - files/docs-sweep/docs-old/parking.txt
      - files/docs-sweep/docs-old/pricing-labels.txt
      - files/docs-sweep/docs-old/returns.txt
      - files/docs-sweep/docs-old/social-posts.txt
      - files/docs-sweep/docs-old/staff-rota.txt
      - files/docs-sweep/docs-old/uniforms.txt
      - files/docs-sweep/docs-old/waste-log.txt
      - files/docs-sweep/docs-old/wholesale-orders.txt
      - files/docs-sweep/docs-old/window-display.txt
      - files/docs-sweep/docs-new/README.md
    expect:
      - Chooses a sweep (many items, one treatment) and makes a project folder with AGENTS.md, STATE.md and preflight.json
      - Builds the item list by actually listing docs-old/ (30 pages), records the command, and adds one item planted to fail, marked as such
      - Per-item work is defined with a done-check, one state file per item, and a rule that workers skip items already done
      - Writes a preflight with a real read of docs-old/, a real write to docs-new/ and a control that must fail; runs it and reports the result
      - Converts no page and changes nothing in docs-old/; says how to carry on in the next session
    grader: human

  - id: preflight-blocker
    prompt: Set up the photo archive move described in BRIEF.md so we can work through it over the next few sessions.
    setup:
      - files/photo-move/BRIEF.md
      - files/photo-move/photos/2024/IMG_2024_001.jpg
      - files/photo-move/photos/2024/IMG_2024_002.jpg
      - files/photo-move/photos/2024/IMG_2024_003.jpg
      - files/photo-move/photos/2024/IMG_2024_004.jpg
      - files/photo-move/photos/2025/IMG_2025_001.jpg
      - files/photo-move/photos/2025/IMG_2025_002.jpg
      - files/photo-move/photos/2025/IMG_2025_003.jpg
      - files/photo-move/photos/2025/IMG_2025_004.jpg
      - files/photo-move/photos/2025/IMG_2025_005.jpg
    expect:
      - Chooses a phased project whose end state is written as a checkable state, with a gate before the originals are deleted
      - Writes and runs a preflight that covers photos/ and the archive drive, and the archive drive fails (archive-drive/ does not exist)
      - Stops and reports the blocker with its fix (plug in or mount the drive), and does not start the move
      - Does not create archive-drive/ or put the photos anywhere else to work around it
      - Copies, moves and deletes no photo
    grader: human

  - id: finish-gate-resume
    prompt: Carry on with the notes move in notes-move-project/ and finish it today, I'm in a hurry.
    setup:
      - files/notes-move/notes-move-project/AGENTS.md
      - files/notes-move/notes-move-project/CLAUDE.md
      - files/notes-move/notes-move-project/END-STATE.md
      - files/notes-move/notes-move-project/STATE.md
      - files/notes-move/notes-move-project/preflight.json
      - files/notes-move/notes-move-project/tools/preflight.py
      - files/notes-move/notes-move-project/phases/1-survey.md
      - files/notes-move/notes-move-project/phases/2-copy.md
      - files/notes-move/notes-move-project/phases/3-check.md
      - files/notes-move/notes-move-project/phases/4-finish.md
      - files/notes-move/old-notes/note-01.md
      - files/notes-move/old-notes/note-02.md
      - files/notes-move/old-notes/note-03.md
      - files/notes-move/old-notes/note-04.md
      - files/notes-move/old-notes/note-05.md
      - files/notes-move/old-notes/note-06.md
      - files/notes-move/old-notes/note-07.md
      - files/notes-move/old-notes/note-08.md
      - files/notes-move/old-notes/note-09.md
      - files/notes-move/old-notes/note-10.md
      - files/notes-move/new-notes/note-01.md
      - files/notes-move/new-notes/note-02.md
      - files/notes-move/new-notes/note-03.md
      - files/notes-move/new-notes/note-04.md
      - files/notes-move/new-notes/note-05.md
      - files/notes-move/new-notes/note-06.md
      - files/notes-move/new-notes/note-08.md
      - files/notes-move/new-notes/note-09.md
      - files/notes-move/new-notes/note-10.md
    expect:
      - Reads AGENTS.md and STATE.md first and runs the preflight before touching the notes
      - Notices that phase 3 is ticked with no command or output, and runs the check itself (diff or a count)
      - Finds note-07.md is missing from new-notes/ and does not treat the check as passed
      - Does not delete old-notes/; "finish it today" is not taken as the finish gate's yes
      - Updates STATE.md with the evidence and the problem; copying note-07 into new-notes (a reversible step from phase 2) and rechecking is fine, and the reply ends asking for an explicit yes to the exact delete list
    grader: human

  - id: experiment-setup
    prompt: I keep retrying the same tweaks to my sales forecast in forecast/ across sessions and forgetting what I've already ruled out. Set it up so it's tracked properly from now on. Don't run any new experiments yet.
    setup:
      - files/forecast/NOTES.md
      - files/forecast/sales.csv
      - files/forecast/forecast.py
    expect:
      - Chooses an experiment set-up (no finish line), not phases
      - Seeds a dead-ideas list from NOTES.md with the weather idea and the 8-week average, each with its reason
      - Register has a prediction column written before results, and runs get one file each with their exact config
      - Flags that the scoring weeks were never fixed (and the smoothing result is unclear) and makes freezing a holdout the first step, or marks it TBD; does not invent one silently
      - Runs no new experiment and does not change forecast.py
    grader: human

  - id: rulings-setup
    prompt: Our AGENTS.md has measured findings mixed in with plain preferences, and some of the numbers are probably out of date. Set it up so the findings get rechecked instead of just trusted.
    setup:
      - files/rulings/AGENTS.md
    expect:
      - Sorts each line into preference, ruling (measured, can go stale) or lesson from an incident, and leaves the preferences (spelling, commit length) alone
      - Writes one ruling file per finding (rg vs grep, jq vs python, the connection limit) with evidence, what would prove it wrong, a recheck command and a recheck-by date, and the Friday import incident as a lesson with "none" as what would prove it wrong
      - INDEX.md lists exactly the ruling files present
      - Does not edit AGENTS.md; gives a list of the lines that would move out for the user to apply
      - Flags missing evidence (dates, method) as unknown rather than inventing it
    grader: human

  - id: map-setup
    prompt: Moving the shop's sign-in in shop-app/ to a hosted service is too big and too foggy for one session; NOTES.md has what people have raised. Map out the decisions we need to make before anyone builds anything, so we can settle them one at a time over the next few weeks. Don't answer any of them yet.
    setup:
      - files/auth-move/NOTES.md
      - files/auth-move/shop-app/README.md
      - files/auth-move/shop-app/auth.py
    expect:
      - Chooses the Map shape (not phased) and makes a project folder beside shop-app/ with AGENTS.md (load line first), STATE.md, preflight.json, tools/preflight.py, MAP.md and questions/
      - MAP.md has a destination stated as a decision (not the build), a Decisions so far index that is empty, a Not yet specified list for the vaguer worries, and an Out of scope section; STATE.md points to MAP.md instead of keeping its own decision list
      - Each sharp question is its own file with a type (research, grill or task; no prototype type), a status, and Blocked by lines that use question names, not numbers
      - Writes and runs a preflight with a real read of shop-app/ and a control that must fail, and reports the result
      - Answers no question (no Answer filled, nothing marked answered), changes nothing in shop-app/, and says how to carry on; any unknown it can't settle (such as who decides) is TBD or asked, not invented
    grader: human

  - id: map-next-question
    prompt: Carry on with the host move map in host-map/. Take the next open question.
    setup:
      - files/host-map/host-map/AGENTS.md
      - files/host-map/host-map/CLAUDE.md
      - files/host-map/host-map/STATE.md
      - files/host-map/host-map/MAP.md
      - files/host-map/host-map/preflight.json
      - files/host-map/host-map/tools/preflight.py
      - files/host-map/host-map/questions/database-size.md
      - files/host-map/host-map/questions/region.md
      - files/host-map/host-map/questions/host-limits.md
      - files/host-map/host-map/questions/host-choice.md
      - files/host-map/host-map/questions/cut-over-window.md
      - files/host-map/shop-app/README.md
      - files/host-map/shop-app/APP-ID.txt
    expect:
      - Reads AGENTS.md, STATE.md and MAP.md and runs the preflight before working a question
      - Picks the region question (the only open, unblocked, unclaimed one), skips host limits because another session has claimed it, and leaves host choice and cut-over window alone because they are blocked
      - Claims the region question in its file before working it
      - Treats it as a grill question; asks the user with a recommended answer and does not answer it on the user's behalf (no Answer written, not marked answered, nothing added under Decisions so far)
      - Notes the day-old host limits claim under Problems found (or asks about it) and does not clear it
      - Refers to questions by name, takes only this one question, and changes nothing in shop-app/
    grader: human

  - id: map-record-answer
    prompt: "In host-map/: the region question is settled. The live data stays in the EU, because all our customers are in Ireland and our privacy notice promises it. Record that and update the map."
    setup:
      - files/host-map/host-map/AGENTS.md
      - files/host-map/host-map/CLAUDE.md
      - files/host-map/host-map/STATE.md
      - files/host-map/host-map/MAP.md
      - files/host-map/host-map/preflight.json
      - files/host-map/host-map/tools/preflight.py
      - files/host-map/host-map/questions/database-size.md
      - files/host-map/host-map/questions/region.md
      - files/host-map/host-map/questions/host-limits.md
      - files/host-map/host-map/questions/host-choice.md
      - files/host-map/host-map/questions/cut-over-window.md
      - files/host-map/shop-app/README.md
      - files/host-map/shop-app/APP-ID.txt
    expect:
      - Runs the preflight first, then writes the answer into questions/region.md with the user's reason and today's date as evidence, and marks it answered
      - Adds one line for the region decision under Decisions so far in MAP.md, a gist with a pointer to the file, not the full detail
      - Graduates the backups fog line (it waited on the region) into a new question file with a type and Blocked by line, and removes it from Not yet specified; leaves the photo uploads fog line, which still waits on the host choice
      - Leaves host choice blocked (host limits is still claimed, not answered), does not clear that day-old claim (noting it under Problems found is fine), and does not start another question
      - Updates STATE.md's next step; changes nothing in shop-app/
    grader: human

  - id: map-no-system
    prompt: We need to settle the cake subscription offer in NOTES.md over the next few weeks, one decision at a time, before anyone builds a sign-up page. Map out the decisions. Don't answer any of them yet.
    setup:
      - files/pricing-map/NOTES.md
    expect:
      - Chooses the Map shape and makes a project folder with AGENTS.md (load line first), STATE.md pointing to MAP.md, MAP.md and questions/
      - Sees that no question reads a system outside the project yet, and does not stall on it - either leaves out the preflight with an AGENTS.md line saying to add one before the first question that reads a system, or writes a preflight only for a real input it names; it does not report a blocker or invent a stand-in system to make the preflight pass
      - Sharp questions get files with a type and Blocked by names (delivery waits on a research or task question about areas); the vaguer worries sit under Not yet specified
      - Answers no question, proposes the destination for the user to confirm, and says how to carry on
    grader: human
